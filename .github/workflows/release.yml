name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tag values are read from env vars, never interpolated into scripts.
      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $match = Select-String -Path src/AssemblyInfo.cs -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)'
          if (-not $match -or $match.Matches[0].Groups[1].Value -ne $version) {
            throw "AssemblyInformationalVersion in src/AssemblyInfo.cs does not match tag $env:GITHUB_REF_NAME"
          }
          Add-Content $env:GITHUB_ENV "VERSION=$version"

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          $name = "SimpleMark-$env:VERSION-win"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item bin/* "dist/$name/"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip" -Encoding ascii
          Add-Content $env:GITHUB_ENV "ASSET=$name"

      # Release notes come from the annotated tag message.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "+refs/tags/$($env:GITHUB_REF_NAME):refs/tags/$($env:GITHUB_REF_NAME)"
          git tag -l --format='%(contents)' $env:GITHUB_REF_NAME | Set-Content -Path notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist/$env:ASSET.zip" "dist/$env:ASSET.zip.sha256" `
            --title "Simple Mark $env:VERSION" --notes-file notes.md --verify-tag
